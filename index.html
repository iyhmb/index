<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="永恒末匕的个人主页：独立开发者 · 创意工程师，手绘涂鸦风格的自我介绍与作品便利贴。">
<meta name="theme-color" content="#fdf8ef">
<title>永恒末匕 · 手绘涂鸦主页</title>
<style>
:root{
  --paper:#fdf8ef;--ink:#46392e;
  --c1:#ffb3ba;--c2:#baffc9;--c3:#bae1ff;--c4:#ffffba;--c5:#e0bbff;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--paper);color:var(--ink);overflow-x:hidden;
  font-family:"Kaiti SC","STKaiti","KaiTi","Comic Sans MS","Segoe Print",cursive;
  -webkit-tap-highlight-color:transparent}

/* 纸张噪点 */
.noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.65;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 18%,rgba(70,57,46,.22),transparent 55%),
    radial-gradient(1.4px 1.4px at 22% 64%,rgba(70,57,46,.18),transparent 55%),
    radial-gradient(1.8px 1.8px at 35% 32%,rgba(70,57,46,.15),transparent 55%),
    radial-gradient(1.3px 1.3px at 48% 82%,rgba(70,57,46,.2),transparent 55%),
    radial-gradient(1.7px 1.7px at 62% 12%,rgba(70,57,46,.17),transparent 55%),
    radial-gradient(1.4px 1.4px at 76% 55%,rgba(70,57,46,.19),transparent 55%),
    radial-gradient(1.8px 1.8px at 88% 28%,rgba(70,57,46,.16),transparent 55%),
    radial-gradient(1.5px 1.5px at 94% 72%,rgba(70,57,46,.2),transparent 55%),
    radial-gradient(1.6px 1.6px at 15% 88%,rgba(70,57,46,.16),transparent 55%),
    radial-gradient(1.4px 1.4px at 58% 45%,rgba(70,57,46,.15),transparent 55%),
    radial-gradient(1.7px 1.7px at 71% 88%,rgba(70,57,46,.17),transparent 55%),
    radial-gradient(1.5px 1.5px at 4% 46%,rgba(70,57,46,.15),transparent 55%)}

.wrap{position:relative;z-index:1;width:min(720px,94vw);margin:0 auto;padding:54px 0 64px}

/* 手绘卡片 */
.doodle{position:relative;border:3px solid var(--ink);background:#fffdf7;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:4px 4px 0 rgba(70,57,46,.16);padding:26px;
  transition:box-shadow .25s ease}
@keyframes shake{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-1.4deg) translateX(-3px)}
  40%{transform:rotate(1.4deg) translateX(3px)}
  60%{transform:rotate(-1deg) translateX(-2px)}
  80%{transform:rotate(1deg) translateX(2px)}
}

/* 标题 */
.title{position:relative;display:inline-block;font-size:clamp(34px,8vw,52px);font-weight:700;
  letter-spacing:3px;transform:rotate(-1.2deg);margin-bottom:26px}
.title .underline{position:absolute;left:-6px;right:-6px;bottom:-10px}
.title .underline svg{width:100%;height:18px;display:block;overflow:visible}
.title .underline path{stroke:#ff8fa3;stroke-width:6;stroke-linecap:round;fill:none;
  stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.role{font-size:clamp(15px,3vw,18px);margin:20px 0 6px;transform:rotate(.6deg);display:inline-block}
.role em{font-style:normal;color:#e07a5f;font-weight:700}
.bio{font-size:15px;line-height:2;margin-top:14px}
.bio b{background:linear-gradient(transparent 62%,rgba(255,179,186,.65) 62%);padding:0 2px}

/* 技能标签 */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.chip{border:2.5px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  padding:8px 17px;font-size:14.5px;font-weight:700;transition:transform .18s}
.c-c1{background:var(--c1)}.c-c2{background:var(--c2)}.c-c3{background:var(--c3)}
.c-c4{background:var(--c4)}.c-c5{background:var(--c5)}.c-c6{background:var(--c1)}

/* 便利贴 */
.notes-title{margin:44px 0 26px;font-size:clamp(20px,4vw,26px);transform:rotate(-.8deg);display:inline-block}
.notes-title em{font-style:normal;color:#e07a5f}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:10px}
.note{position:relative;background:var(--c3);border:2.5px solid var(--ink);padding:34px 20px 22px;
  font-size:14.5px;line-height:1.85;cursor:pointer;
  border-radius:4px 12px 8px 14px;box-shadow:6px 8px 0 rgba(70,57,46,.18);
  --r:-1.6deg;transform:rotate(var(--r));
  transition:box-shadow .25s ease;outline:none}
.note::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:96px;height:26px;background:rgba(255,255,255,.55);border:2px solid rgba(70,57,46,.35);
  border-radius:3px;box-shadow:0 2px 4px rgba(70,57,46,.12)}
.note h3{font-size:18px;margin-bottom:7px}
.note .tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.note .tag{font-size:12px;padding:2px 10px;border:1.5px solid var(--ink);border-radius:20px;background:rgba(255,255,255,.5)}
.n1{background:var(--c1)}.n2{background:var(--c4)}.n3{background:var(--c5)}
@keyframes nlift{
  0%{transform:rotate(var(--r)) translateY(0)}
  30%{transform:rotate(calc(var(--r) + 1.6deg)) translateY(-14px)}
  60%{transform:rotate(calc(var(--r) - 1.1deg)) translateY(-12px)}
  100%{transform:rotate(var(--r)) translateY(-10px) scale(1.03)}
}

/* 只在支持 hover 的设备上启用悬停动画，避免触屏“卡住” */
@media (hover:hover) and (pointer:fine){
  .doodle:hover{animation:shake .5s ease}
  .chip:hover{animation:shake .45s ease}
  .note:hover{animation:nlift .5s ease forwards;box-shadow:12px 18px 0 rgba(70,57,46,.22)}
}

/* 键盘可达性 */
.chip:focus-visible,
.note:focus-visible{outline:3px dashed #e07a5f;outline-offset:6px}

.sig{text-align:right;margin-top:50px;font-size:17px;transform:rotate(-1deg)}
.sig em{font-style:normal;color:#e07a5f;font-weight:700}
.squiggle{display:block;width:130px;height:22px;margin:34px auto 0}
.squiggle path{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;opacity:.5}

/* 边角涂鸦 */
.side-doodle{position:fixed;z-index:0;font-size:30px;opacity:.4;pointer-events:none;
  animation:sway 5s ease-in-out infinite alternate}
.d1{top:26px;right:34px;transform:rotate(12deg)}
.d2{bottom:26px;left:30px;font-size:24px;animation-delay:1.4s;transform:rotate(-10deg)}
@keyframes sway{from{transform:translateY(0) rotate(8deg)}to{transform:translateY(-14px) rotate(-8deg)}}

/* 点击印章 */
.stamp{position:fixed;z-index:50;pointer-events:none;font-weight:700;line-height:1;
  will-change:transform,opacity;animation:stamp .95s ease-out forwards}
@keyframes stamp{
  0%{transform:translate(-50%,-50%) scale(.15) rotate(-14deg);opacity:0}
  28%{opacity:1}
  62%{transform:translate(-50%,-50%) scale(1.4) rotate(var(--sr,0deg));opacity:.95}
  100%{transform:translate(-50%,-50%) scale(.92) rotate(var(--sr,0deg));opacity:0}
}

/* 提示纸条 */
.note-toast{position:fixed;left:50%;bottom:34px;z-index:60;max-width:86vw;
  transform:translate(-50%,24px) rotate(-1deg);
  padding:13px 22px;font-size:15px;text-align:center;background:#ffffba;
  border:2.5px solid var(--ink);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:4px 5px 0 rgba(70,57,46,.3);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}
.note-toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}

@media (max-width:680px){
  .notes{grid-template-columns:1fr;gap:30px}
  .wrap{padding-top:38px}
}

/* 尊重系统的“减少动态效果”设置 */
@media (prefers-reduced-motion:reduce){
  .title .underline path,
  .side-doodle{animation:none}
  .title .underline path{stroke-dashoffset:0}
  .note:hover,
  .doodle:hover,
  .chip:hover{animation:none}
  .note:hover{transform:translateY(-8px) rotate(var(--r))}
  .note-toast{transition:opacity .15s linear}
}
</style>
</head>
<body>
<span class="side-doodle d1" aria-hidden="true">☀</span>
<span class="side-doodle d2" aria-hidden="true">✿</span>
<div class="noise" aria-hidden="true"></div>

<main class="wrap">

  <h1 class="title">嗨，我是永恒末匕
    <span class="underline" aria-hidden="true">
      <svg viewBox="0 0 300 20" preserveAspectRatio="none">
        <path d="M4 12 Q 60 2 120 10 T 296 9"></path>
      </svg>
    </span>
  </h1>

  <p class="role">独立开发者 <em>·</em> 创意工程师 <em>·</em> 6 年全栈经验</p>

  <section class="doodle" data-tilt style="--r:-1.2deg;transform:rotate(-1.2deg)" aria-labelledby="about-title">
    <h2 id="about-title" style="font-size:19px;transform:rotate(.4deg)">关于我</h2>
    <p class="bio">专注 <b>前端交互</b>、<b>数据可视化</b> 与 <b>创意编程</b>。相信一句话：<b>把复杂留给代码，把简单留给用户。</b></p>
    <div class="chips">
      <span class="chip c-c1" data-tilt style="--r:-1.7deg;transform:rotate(-1.7deg)">HTML/CSS 92</span>
      <span class="chip c-c2" data-tilt style="--r:.7deg;transform:rotate(.7deg)">JavaScript 88</span>
      <span class="chip c-c3" data-tilt style="--r:-2.1deg;transform:rotate(-2.1deg)">Vue·React 85</span>
      <span class="chip c-c4" data-tilt style="--r:-.3deg;transform:rotate(-.3deg)">Node.js 78</span>
      <span class="chip c-c5" data-tilt style="--r:1.8deg;transform:rotate(1.8deg)">Canvas·SVG 90</span>
      <span class="chip c-c6" data-tilt style="--r:2.7deg;transform:rotate(2.7deg)">UI 设计 80</span>
    </div>
  </section>

  <h2 class="notes-title">一些 <em>小作品</em> 便利贴</h2>

  <section class="notes" aria-label="作品便利贴">
    <div class="note n1" data-tilt tabindex="0" role="button"
         data-detail="星图笔记 🌌 · 可视化笔记工具，开源，把想法连成星座。"
         style="--r:-1.9deg;transform:rotate(-1.9deg)">
      <h3>星图笔记</h3>
      <p>可视化笔记工具，把想法连成星座。</p>
      <div class="tags"><span class="tag">Vue</span><span class="tag">开源</span></div>
    </div>

    <div class="note n2" data-tilt tabindex="0" role="button"
         data-detail="像素小镇 🏘️ · 像素风沙盒小游戏，一砖一瓦盖出小镇。"
         style="--r:-.1deg;transform:rotate(-.1deg)">
      <h3>像素小镇</h3>
      <p>像素风沙盒小游戏，自由建造。</p>
      <div class="tags"><span class="tag">Canvas</span><span class="tag">游戏</span></div>
    </div>

    <div class="note n3" data-tilt tabindex="0" role="button"
         data-detail="声音花园 🎛️ · WebAudio 交互实验，让声音在花园里生长。"
         style="--r:1.3deg;transform:rotate(1.3deg)">
      <h3>声音花园</h3>
      <p>WebAudio 交互实验，会唱歌。</p>
      <div class="tags"><span class="tag">WebAudio</span><span class="tag">创意</span></div>
    </div>
  </section>

  <svg class="squiggle" viewBox="0 0 130 22" aria-hidden="true">
    <path d="M3 11 Q 18 2 33 11 T 63 11 T 93 11 T 127 10"></path>
  </svg>

  <p class="sig">—— <em>永恒末匕手绘</em> ✎</p>

</main>

<div class="note-toast" id="noteToast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var toast      = document.getElementById('noteToast');
  var toastTimer = null;
  var reduceMQ   = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced    = reduceMQ.matches;

  if (reduceMQ.addEventListener) {
    reduceMQ.addEventListener('change', function(e){ reduced = e.matches; });
  }

  /* ---------- 1. 给每个元素一个随机小倾角，增加手绘感 ---------- */
  document.querySelectorAll('[data-tilt]').forEach(function(el){
    var r = (Math.random() * 6 - 3).toFixed(1);
    el.style.setProperty('--r', r + 'deg');
    el.style.transform = 'rotate(' + r + 'deg)';
  });

  /* ---------- 2. 点击空白处盖一枚随机涂鸦章 ---------- */
  var MARKS  = ['✿','☀','★','♥','❀','☂','✎','⚘','✧','❁'];
  var COLORS = ['#e07a5f','#6d8f4f','#5b8fc7','#c2577b','#8f6bb5','#b58a3c'];
  var stampCount = 0;

  function stamp(x, y){
    if (reduced || stampCount > 24) return;
    stampCount++;

    var s = document.createElement('span');
    s.className = 'stamp';
    s.setAttribute('aria-hidden', 'true');
    s.textContent = MARKS[(Math.random() * MARKS.length) | 0];
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    s.style.fontSize = (22 + Math.random() * 18) + 'px';
    s.style.color = COLORS[(Math.random() * COLORS.length) | 0];
    s.style.setProperty('--sr', ((Math.random() * 50 - 25) | 0) + 'deg');

    s.addEventListener('animationend', function(){
      s.remove();
      stampCount--;
    }, { once: true });

    document.body.appendChild(s);
  }

  /* 用 pointerdown + pointerup 位移判断，避免滚动/拖动时误触发 */
  var down = null;
  document.addEventListener('pointerdown', function(e){
    if (e.button !== undefined && e.button !== 0) return;   // 只响应主键
    down = { x: e.clientX, y: e.clientY, id: e.pointerId };
  }, { passive: true });

  document.addEventListener('pointerup', function(e){
    if (!down || down.id !== e.pointerId) return;
    var dx = e.clientX - down.x;
    var dy = e.clientY - down.y;
    down = null;

    if (Math.sqrt(dx * dx + dy * dy) > 10) return;                 // 判定为滑动
    if (e.target.closest('.note, a, button, input, textarea, select')) return; // 交互元素不盖章
    stamp(e.clientX, e.clientY);
  }, { passive: true });

  document.addEventListener('pointercancel', function(){ down = null; }, { passive: true });

  /* ---------- 3. 便利贴：弹出手写风小纸条 ---------- */
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toast.classList.remove('show');
    }, 2400);
  }

  document.querySelectorAll('.note').forEach(function(note){
    var detail = note.dataset.detail ||
                 (note.querySelector('h3') ? note.querySelector('h3').textContent : note.textContent.trim());

    note.addEventListener('click', function(){ showToast(detail); });

    /* 键盘可达：Enter / 空格 */
    note.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        showToast(detail);
      }
    });
  });
})();
</script>
</body>
</html>
